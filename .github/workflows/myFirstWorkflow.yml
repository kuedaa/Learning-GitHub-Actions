name: my-first-workflow
on:
  push:
    branches:  
      - main
  pull_request: 
    branches: 
      - main
env:
  ENV_TYPE: DEV
  APP_USER: kuedaa
  APP_PORT: 80
  
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr 
          hostname
      - name: Step-2 - Checkout
        uses: actions/checkout@v6.0.3
      - name: Step-3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt
      - name: Upload Single file
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt

  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: single_file
      - name: Checking current directory post download
        run: |
          pwd
          ls -ltr
      - name: Referring Environnment Variables
        run: |
          echo "[INFO] Running Deployment for $ENV_TYPE with user $APP_USER."
          echo "[INFO] Once deployment application is accessible on port $APP_PORT."
      - name: Referring Repository Secret
        run: |
          echo "[INFO] Application password is ${{ secrets.APP_PASSWORD }}."

  job3:
    name: JOB3
    runs-on: ubuntu-latest
    steps:
      - name: Referring context or in-built variable
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}."
          echo "[INFO] New changes are added by ${{ github.actor }} in ${{ github.ref_name}} branch."
          echo "[INFO] Current Step is running on ${{runner.os }}."
          echo "[INFO] Current JOB ID is ${{job.check_run_id }}."
